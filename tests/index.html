<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>editor test</title>
    <script>
      // Mock Tauri IPC antes de cargar la app: sin esto invoke() lanzaría.
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => {
          if (cmd === "correct_transcript")
            return Promise.resolve("Si, ahora puedo escribir en el editor.");
          return Promise.reject(new Error("mock: comando no stubbeado: " + cmd));
        },
        transformCallback: () => 0,
      };
      window.__TAURI__ = {};
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
