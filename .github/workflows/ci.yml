name: CI

# La capa de privacidad se verifica igual que el resto: un refactor que rompa la
# sanitización o la puerta de exportación debe fallar aquí antes de distribuir.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust (fmt + clippy + tests)
    # Apple Silicon: es la plataforma donde se ejecuta la inferencia real
    # (Metal) y la única documentada como soportada para el demo.
    # Xcode 15.4 on macos-14 cannot compile ggml's Apple M4 SME variant.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # llama-cpp se compila desde el crate; no hay paso nativo manual.
      - name: Tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Original-page editor workflows
        run: |
          pnpm exec playwright install webkit
          pnpm test:layout:ui
      - name: Independent PDF layout verification
        run: |
          python3 -m venv .build-cache/layout-qa
          .build-cache/layout-qa/bin/pip install Pillow==12.3.0 pypdf==6.10.0
          .build-cache/layout-qa/bin/python scripts/verify-layout-output.py

  privacy-ui:
    name: UI (privacy, setup, editor, audio)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Match the pinned Playwright dependency; browsers and OS libraries are baked in.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui
