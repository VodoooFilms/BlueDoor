name: Windows x64 CPU installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-x64.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'tests/**'
      - '.cargo/**'
      - '*lock*'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target\windows-x64
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      TRANSCRIBE_CMAKE_ARGS: -DTRANSCRIBE_X86_CONSERVATIVE=ON
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          install: make diffutils nasm pkgconf
          update: false
      - name: Native toolchain
        shell: pwsh
        run: |
          'C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'MSYS2_BASH=${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install psutil==7.0.0 pypdf==6.10.0
      - run: pnpm typecheck
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: python tests/check-windows-packaging.py
      - name: Build CPU runtime and NSIS installer
        shell: pwsh
        run: ./scripts/release-windows.ps1 -Architecture x64
      - name: Install and launch actual NSIS payload
        shell: pwsh
        run: ./scripts/smoke-windows-x64.ps1 -Release "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release" -Output "$env:GITHUB_WORKSPACE\artifacts\windows-x64\startup"
      - name: Native suites and real model Detect → Protect → Export
        shell: pwsh
        run: python scripts/test-windows-x64.py --release "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release" --output artifacts/windows-x64
      - name: Existing privacy and setup UI regressions (mock IPC)
        run: |
          pnpm exec playwright install webkit
          pnpm test:ui
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe" | ForEach-Object {
            $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$Hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Downloadable installer (only after all gates pass)
        uses: actions/upload-artifact@v4
        with:
          name: BlueDoor-Windows-x64-CPU-${{ github.run_number }}
          path: |
            src-tauri/target/windows-x64/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/windows-x64/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Test evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDoor-Windows-x64-report-${{ github.run_number }}
          path: |
            artifacts/windows-x64/
            src-tauri/target/windows-x64/runtime-x64.json
            src-tauri/resources/runtime/ffmpeg-build.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run summary
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          lines = ['## BlueDoor Windows x64 CPU', '', 'Commit: ' + os.environ['GITHUB_SHA'], '',
                   'Status: ${{ job.status }}', '',
                   'VM windows-2022; physical Windows 10/11 Intel/AMD and 4 GB RAM remain unvalidated.', '',
                   '| Evidence | Result |', '| --- | --- |']
          for path in sorted(Path('artifacts/windows-x64').rglob('*.json')):
              value = json.loads(path.read_text(encoding='utf-8-sig'))
              lines.append('| ' + str(path) + ' | ' + json.dumps(value).replace('|', '/') + ' |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          '@ | python -
