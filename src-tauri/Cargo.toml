[package]
name = "bluedoor"
version = "0.4.0"
description = "Local & Private BlueDoor Transcription"
authors = ["BlueDoor"]
edition = "2021"
license = "MIT"

[lib]
name = "bluedoor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["tls"] }
genpdf = "0.2"
encoding_rs = "0.8"

tempfile = "3"
sha2 = "0.10"
fs2 = "0.4"
regex = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
bip39 = { version = "2", features = ["rand", "spanish"] }
base64 = "0.22"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
tauri-plugin-opener = "=2.5.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"
llama-cpp-2 = { version = "=0.1.156", default-features = false, features = ["dynamic-link", "dynamic-backends"] }
transcribe-cpp = "0.2.4"
hound = "3.5"

# Android links llama.cpp statically inside the application library: no
# runtime backend discovery, no extra .so files to package, and a single C++
# runtime baked into the APK.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
llama-cpp-2 = { version = "=0.1.156", default-features = false, features = ["android-static-stdcxx"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-sys-2 = { version = "=0.1.156", default-features = false, features = ["dynamic-link", "dynamic-backends", "metal"] }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "android")))'.dependencies]
llama-cpp-sys-2 = { version = "=0.1.156", default-features = false, features = ["dynamic-link", "dynamic-backends"] }
# Keep full model verification fast in development on Apple Silicon.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[profile.dev.package.sha2]
opt-level = 3
